<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iMARKA | Student Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- Top Navigation Bar -->
    <header class="topbar">
        <div class="top-logo">iMARKA</div>
        <nav class="navbar">
            <div class="faculty-menu">
                <button class="nav-button">
                    <a href="faculty.html" style="color: inherit; text-decoration: none;">Faculty</a>
                    <span class="arrow">⌄</span>
                </button>
                <div class="dropdown">
                    <a href="faculty.html">Faculty List</a>
                    <a href="#">Faculty Grades</a>
                    <a href="#">Faculty Management</a>
                </div>
            </div>

            <div class="student-menu">
                <button class="nav-button active">
                    Students
                    <span class="arrow">⌄</span>
                </button>
                <div class="dropdown">
                    <a href="student.html">Student List</a>
                    <a href="#">Student Records</a>
                </div>
            </div>
        </nav>
    </header>

    <!-- Main Content Area -->
    <main class="container">
        <!-- Banner -->
        <section class="admin-header">
            <div class="admin-title">
                <div class="imarka-logo">
                    <span>i</span>MARKA
                </div>
                <div class="vertical-line"></div>
                <div class="dashboard-name">Admin Dashboard</div>
            </div>
            <button class="logout" onclick="alert('Logged out!')">
                Logout
            </button>
        </section>

        <!-- College Header -->
        <section class="college-card">
            College of Computer Studies
        </section>

        <!-- Student Count Cards -->
        <section class="student-cards">
            <div class="student-count">
                <strong>Regular Student</strong>
                <span>100</span>
            </div>
            <div class="student-count">
                <strong>Irregular Student</strong>
                <span>25</span>
            </div>
        </section>

        <!-- Dashboard Statistics & Freedom Wall Grid -->
        <section class="dashboard-grid">
            <div class="statistics-card">
                <h3>STATISTICS:</h3>
                <div class="donut-container">
                    <canvas id="genderChart"></canvas>
                    <div class="gender-icon">
                        <span class="person male">♂</span>
                        <span class="person female">♀</span>
                    </div>
                </div>
                <div class="legend">
                    <div class="legend-item">
                        <span class="blue-dot"></span>
                        <span>Boys</span>
                    </div>
                    <div class="legend-item">
                        <span class="pink-dot"></span>
                        <span>Girls</span>
                    </div>
                </div>
            </div>

            <div class="right-column">
                <div class="grade-statistics">
                    <h3>GRADE STATISTICS:</h3>
                    <div class="chart-wrapper">
                        <canvas id="gradeChart"></canvas>
                    </div>
                </div>
                <div class="freedom-wall">
                    <h3>FREEDOM WALL:</h3>
                    <div class="message-card">
                        <strong>USER 1</strong>
                        <p>May mold po sa may kisame malapit sa elevator.</p>
                    </div>
                    <div class="yellow-line"></div>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
